name: performance_list_view
description: Fast Flutter list, grid and masonry with pagination that never gets stuck, pull-to-refresh, sticky headers, skeletons, scroll-to-index and an AI chat streaming view.
version: 1.0.0
homepage: https://github.com/developerashkan/performance_list_view
repository: https://github.com/developerashkan/performance_list_view
issue_tracker: https://github.com/developerashkan/performance_list_view/issues
topics:
  - listview
  - pagination
  - infinite-scroll
  - performance
  - chat
screenshots:
  - description: 'An AI reply streaming token by token into the chat view'
    path: assets/screenshots/hero.gif
  - description: 'Infinite feed with pagination'
    path: assets/screenshots/phone_feed_light.png
  - description: 'Masonry grid in dark mode'
    path: assets/screenshots/phone_masonry_dark.png
  - description: 'Sticky section headers with an A to Z index'
    path: assets/screenshots/phone_contacts_light.png
  - description: 'AI chat view in dark mode'
    path: assets/screenshots/phone_chat_dark.png

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
